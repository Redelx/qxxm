[build]
    command = "pip install -r requirements.txt"
    functions = "netlify/functions"
    publish = "frontend"   # 👈 新增这一行

[[redirects]]
    from = "/api/*"
    to = "/.netlify/functions/api/:splat"
    status = 200
    force = true

[[redirects]]
    from = "/hello"
    to = "/.netlify/functions/hello"
    status = 200
    force = true
